bilingual:
  eyebrow: Notre modèle
  title: "Grandir ensemble : notre programme académique bilingue"
  body: Nous répartissons le temps d’enseignement de façon à assurer l’aisance et la maîtrise académique dans les deux langues.
  points:
    - title: L’approche 50/50
      body: "Les matières fondamentales sont réparties à parts égales entre les deux langues : les mathématiques en français un jour, les sciences en anglais le lendemain."
    - title: Des enseignants natifs
      body: Toutes les classes sont co-animées ou dirigées par des locuteurs natifs de l’anglais et du français, ce qui apporte une prononciation authentique et un contexte culturel réel.
    - title: Le translanguaging
      body: Les élèves apprennent à passer d’une langue à l’autre sans effort, développant ainsi la résolution de problèmes et l’esprit critique.
  cta: Voir le programme

levels:
  eyebrow: Nos niveaux
  title: De la maternelle au collège
  intro: Champions Schools accueille les élèves de la maternelle au collège, avec un internat.
  items:

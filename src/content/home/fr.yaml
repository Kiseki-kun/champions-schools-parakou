testimonial:
  eyebrow: Ce que disent les parents
  quote: Mon enfant n’a pas seulement appris le français. Elle l’a maîtrisé.
  body: Ce qui m’a le plus impressionnée, c’est de voir à quel point mon enfant a fini par réussir dans le programme français. Ce qui rend la chose plus remarquable encore, c’est qu’elle apprenait l’anglais et le français depuis le début. À son départ de Champions, ses résultats dans le programme français étaient excellents, même comparés à ceux d’élèves qui n’avaient suivi qu’un cursus francophone. Cela m’a montré que le système bilingue fonctionne vraiment.
  attribution: Mama Hikmah — parent d’une ancienne élève de Champions Schools
  note: Témoignage recueilli en anglais et traduit.
  cta: Lire tous les témoignages


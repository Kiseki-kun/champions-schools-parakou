      name: Maternelle
      range: Maternelle 1 au 3 · Nursery 1 – 3
      hoursLabel: Horaires
      hours: 7h30 – 14h30
      body: Les trois années de maternelle, et les journées les plus courtes de l’école.
    - index: "02"
      name: Primaire
      range: CI au CM2 · Primary 1 – 6
      hoursLabel: Horaires
      hours: 7h30 – 15h30

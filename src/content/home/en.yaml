testimonial:
  eyebrow: What parents are saying
  quote: My child didn’t just learn French. She mastered it.
  body: One of the things that impressed me most was seeing how well my child eventually performed in the French curriculum. What makes it even more remarkable is that she had been learning both English and French from the beginning. By the time she left Champions, her performance in the French programme was outstanding, even compared with students who had been following a French-only curriculum. It showed me that the bilingual system really works.
  attribution: Mama Hikmah — parent of a former Champions Schools student
  cta: Read all the testimonials


bilingual:
  eyebrow: Our model
  title: "Growing Globally: our bilingual academic programme"
  body: We balance our instructional time to ensure fluency and academic mastery in both languages.
  points:
    - title: The 50/50 approach
      body: Core subjects are split equally between the two languages. A child studies mathematics in French one day and science in English the next.
    - title: Native-speaking educators
      body: All classes are co-taught or led by native speakers of English and French, providing authentic pronunciation and real cultural context.
    - title: Translanguaging confidence
      body: Students learn to switch effortlessly between languages, developing advanced problem-solving and critical-thinking skills.
  cta: See the programme


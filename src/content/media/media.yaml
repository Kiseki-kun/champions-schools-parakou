# EXCLUDED — kept on the record, never published.
#
# The building in this image carries painted signage reading "CHAMPIONS NURSERY
# & PRIMARY SCHOOL (CMPS)" and "CHAMPIONS INTERNATIONAL COLLEGE (CICO) PARAKOU".
# Those are not the confirmed school name (Phase 1 risk R3, escalated to Q21;
# the school confirmed "Champions Schools Parakou"). Publishing it would put a
# conflicting entity name on the school's own site, in a photograph, where no
# caption can undo it.
#
# The entry stays here so the decision is documented and so the id cannot be
# silently reused. `excluded` is enforced in three places, not by convention:
# the schema requires a reason, scripts/prepare-assets.mjs derives no web master
# (so the bytes never reach dist/), and SchoolImage throws at build time if any
# page asks for it. tests/qa-check.mjs fails if any of that stops being true.

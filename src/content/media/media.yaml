# ------------------------------------------------------------------
# A NOTE ON `status`, added by the Phase 8 audit.
#
# `status` answers one question and only one: is this an image of something
# that EXISTS, or an image of the campus that is still being built? It is what
# drives the "Future Campus Concept" frame and the alt-text prefix the schema
# enforces. It is not a statement about how an image was made.
#
# That distinction matters for the four Head of Sections portraits below. They
# show characteristics associated with AI generation; the school reviewed them,
# considers them "as good as a professional photoshoot", and directed that they
# be used [SOURCE — R2-1, discovery §11.2]. So their alt text names the person
# and the role — "M. Houtunde Houngbedji Sylvain, Directeur Général" — and
# never asserts that the image is a photograph. Nothing on the site calls them
# photographs either. `Founders.jpeg` and `staffs.jpeg` are camera photographs.
# ------------------------------------------------------------------


# THE IMAGE MANIFEST
#
# Image status NEVER comes from a folder path. It is declared here and checked
# by the schema in src/content.config.ts at build time.
#
# `source` is relative to 02-School-Assets/ and is READ-ONLY. Originals are
# never modified. scripts/prepare-assets.mjs derives web masters into
# src/assets/ from these entries.
#
# Phase 4 declares the images the foundation uses. Remaining images are added
# with the pages that use them.

- id: logo
  source: "logo/school logo.jpeg"
  status: photograph
  category: brand
  decorative: true
  alt:
    en: ""
    fr: ""


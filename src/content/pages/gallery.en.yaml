# gallery — EN
# Every claim is traceable to 01-School-Information/school-information.docx.
# Copy-editing corrections from 01-DISCOVERY-AND-REQUIREMENTS.md §9.4 are applied;
# no factual content is changed. Nothing here is invented.
#
# REDESIGNED 13 September 2026 (final). Every photograph in 02-School-Assets/Events
# is published exactly once, and every one of them opens in the full-screen viewer.
# The page is four uniform photograph grids — two columns on a phone, three on a
# tablet, four on a desktop, every cell square and equal — and nothing else. The
# earlier full-bleed figures and mosaics were removed so that no photograph is
# given more weight than another; their photographs moved into the grids below,
# so the page still carries all 52 and still repeats none. See PageBlocks.astro.


  eyebrow: Nos enseignants
  title: Des locuteurs natifs dans les deux langues
  body:
  - Toutes les classes sont co-animées ou dirigées par des locuteurs natifs de l’anglais et du français,
    ce qui apporte une prononciation authentique et un contexte culturel réel.
  - 'C’est ce qui fait vivre le modèle 50/50 dans les faits, et pas seulement sur l’emploi du temps
    : l’enfant entend chaque langue de la bouche de quelqu’un dont c’est la langue.'

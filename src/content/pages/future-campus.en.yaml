  title: Technology and computer-based learning
  body:
  - The school’s computer room is where technology and computer-based learning happen. Introducing
    learners to technology and digital tools that expand how they learn, create, communicate and
    solve problems is one of the six commitments in our mission.
  - Alongside the classrooms of the Nursery, Primary and College sections, the school has boarding
    facilities and a learning environment designed to support both academic and personal development.

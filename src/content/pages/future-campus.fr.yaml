  image: computer-lab
  focus: 50% 45%
  eyebrow: Aujourd’hui
  title: La technologie et l’apprentissage sur ordinateur
  body:
  - La salle informatique de l’école est le lieu de l’apprentissage par la technologie. Initier les
    élèves aux technologies et aux outils numériques qui élargissent leur façon d’apprendre, de créer,
    de communiquer et de résoudre des problèmes est l’un des six engagements de notre mission.
  - Aux côtés des salles de classe de la maternelle, du primaire et du collège, l’école dispose d’un
    internat et d’un cadre d’apprentissage conçu pour soutenir le développement académique et personnel.
- type: concepts

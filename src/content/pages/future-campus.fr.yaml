  title: Un nouveau campus, en construction
  body:
  - L’école construit un nouveau campus à Parakou. Les images ci-dessous sont des représentations
    conceptuelles de ce projet. Ce ne sont pas des photographies des bâtiments tels qu’ils existent
    aujourd’hui.
  - Chacune est signalée comme une image conceptuelle partout où elle apparaît sur ce site.

  eyebrow: How to enquire
  title: Admissions are handled directly by the school
  body:
  - To enquire about a place for your child, write to the school’s official email address or call
    one of the school’s telephone numbers. Both are listed further down this page.
  - Fees, dates and the steps that follow your enquiry are not published on this website. The school
    confirms them with you directly when you make contact.

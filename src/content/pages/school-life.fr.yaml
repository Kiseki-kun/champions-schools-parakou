locale: fr
page: school-life
title: L’école ne s’arrête pas à la porte de la classe
lead: Les élèves sont encouragés à explorer, créer, concourir, collaborer et découvrir le monde qui
  les entoure.
hero:
  image: excursion-sculpture-ride
  focus: 50% 42%
  eyebrow: Vie scolaire
blocks:
- type: mosaic
  eyebrow: Au-delà des murs
  title: Apprendre hors de la salle de classe
  body:
  - Des sorties éducatives à l’apprentissage par la technologie, des compétitions académiques aux
    activités parascolaires, nous croyons qu’une éducation qui a du sens se joue dans la salle de
    classe et au-delà.
  - La journée sportive inter-maisons, les cours pratiques et les sorties font partie de l’année
    scolaire, et non d’un supplément.
  lead: excursion-sculpture
  support:
  - sports-day-houses
  - practical-tie-dye
  chipsLabel: Nos clubs
  chips:
  - Jet Club
  - Press Club
  - Literary Club
  - Arts and Drama Club
- type: feature
  side: right
  image: assembly
  focus: 50% 42%
  eyebrow: Caractère et valeurs
  title: Une éducation qui dépasse l’instruction
  body:
  - Nous avons reconnu très tôt que l’éducation doit dépasser l’instruction académique. Les valeurs
    chrétiennes et la formation du caractère font partie intégrante de la vie scolaire et encouragent
    les élèves à développer l’intégrité, le sens des responsabilités, la compassion et le respect
    d’autrui.
  - Un enfant véritablement éduqué n’est pas seulement instruit. Un enfant véritablement éduqué est
    prêt à penser, à diriger, à servir et à faire la différence.

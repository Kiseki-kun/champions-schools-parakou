  focus: 50% 38%
  full: true
- type: index
  tone: tint
  eyebrow: Ce dont bénéficient nos élèves
  title: L’étendue de l’expérience Champions
  intro: 'À mesure que l’école a grandi, l’expérience Champions s’est élargie. Aujourd’hui, nos
    élèves bénéficient de :'
  items:
  - index: '01'
    name: Un internat
    body: L’école dispose d’un internat en plus de son externat.
  - index: '02'
    name: La technologie et l’apprentissage sur ordinateur
    body: Les élèves travaillent avec des ordinateurs et des outils numériques dans le cadre de leur
      formation.
  - index: '03'
    name: Les compétitions académiques
    body: Nos élèves se sont distingués dans des compétitions comme l’English Challenge Championship.
  - index: '04'
    name: Les sorties éducatives et l’apprentissage par l’expérience
    body: Une éducation menée au-delà des manuels, par des visites, des travaux pratiques et des
      projets.
  - index: '05'
    name: La formation du caractère et des valeurs
    body: L’intégrité, le sens des responsabilités, la compassion et le respect d’autrui, cultivés
      dans la vie scolaire.
  - index: '06'
    name: Le leadership et le développement personnel
    body: Des occasions pour les élèves de découvrir leurs capacités et de prendre des responsabilités.
  - index: '07'
    name: La communauté
    body: Nous saisissons les occasions de contribuer à la vie de la communauté, notamment par notre
      participation aux programmes de sensibilisation au cancer de la Pink Foundation.

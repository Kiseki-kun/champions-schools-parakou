  eyebrow: Comment nous écrire
  title: Les admissions sont traitées directement par l’école
  body:
  - Pour demander une place pour votre enfant, écrivez à l’adresse électronique officielle de l’école
    ou appelez l’un de ses numéros de téléphone. Les deux figurent plus bas sur cette page.
  - Les frais, les dates et les étapes qui suivent votre demande ne sont pas publiés sur ce site.
    L’école vous les confirme directement lorsque vous la contactez.
